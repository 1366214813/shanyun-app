name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  ios:
    name: Build iOS (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Switch to Xcode 26 (Swift 6.2 required by expo SPM)
        run: |
          ls /Applications | grep -i xcode
          XCODE_DIR=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR"
          xcodebuild -version
          xcrun swift --version

      - name: Pod install
        working-directory: ios
        run: |
          pod install
          ls -la

      - name: Build simulator .app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace app.xcworkspace \
            -scheme app \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-build.log
        shell: bash

      - name: Locate .app bundle
        id: app
        working-directory: ios
        run: |
          ls -la build/Build/Products/Debug-iphonesimulator/ || exit 1
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 2 -name '*.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_OUTPUT"
          ls -lh "$APP"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: jindou-ios-simulator.app
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error