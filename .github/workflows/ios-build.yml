name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  ios:
    name: Build iOS (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Lower Swift tools version for Xcode 16.4 compat
        run: |
          sed -i '' 's/swift-tools-version: 6\.2/swift-tools-version: 6.1/' node_modules/@expo/expo-modules-macros-plugin/apple/Package.swift
          sed -i '' 's/swift-tools-version: 6\.2/swift-tools-version: 6.1/' node_modules/expo-modules-jsi/apple/Package.swift
          grep -rn "swift-tools-version" node_modules/@expo/expo-modules-macros-plugin/apple/Package.swift node_modules/expo-modules-jsi/apple/Package.swift

      - name: Pod install
        working-directory: ios
        run: |
          pod install
          ls -la
          ls -la *.xcworkspace

      - name: Build simulator .app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace app.xcworkspace \
            -scheme app \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-build.log
        shell: bash

      - name: Locate .app bundle
        id: app
        working-directory: ios
        run: |
          ls -la build/Build/Products/Debug-iphonesimulator/ || exit 1
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 2 -name '*.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_OUTPUT"
          ls -lh "$APP"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: jindou-ios-simulator.app
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error