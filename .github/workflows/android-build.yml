name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build arm64 APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Locate APK
        id: apk
        working-directory: android
        run: |
          find app/build/outputs -name '*.apk' -type f
          APK=$(find app/build/outputs -name '*release*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs -name '*.apk' -type f | head -1)
          fi
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jindou-android-arm64.apk
          path: android/${{ steps.apk.outputs.APK }}
          if-no-files-found: error
