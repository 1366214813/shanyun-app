name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch native modules
        run: |
          # Fix onnxruntime-react-native: VersionNumber not available in Gradle 8+
          sed -i 's/VersionNumber.parse(REACT_NATIVE_VERSION) < VersionNumber.parse("0.71")/REACT_NATIVE_MINOR_VERSION < 71/g' \
            node_modules/onnxruntime-react-native/android/build.gradle
          # Fix onnxruntime: latest.integration not resolvable
          sed -i 's/com.microsoft.onnxruntime:onnxruntime-android:latest.integration/com.microsoft.onnxruntime:onnxruntime-android:1.24.3/g' \
            node_modules/onnxruntime-react-native/android/build.gradle
          sed -i 's/com.microsoft.onnxruntime:onnxruntime-android-qnn:latest.integration/com.microsoft.onnxruntime:onnxruntime-android-qnn:1.24.3/g' \
            node_modules/onnxruntime-react-native/android/build.gradle
          # Remove ble-plx codegen to avoid CMake conflict
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('node_modules/react-native-ble-plx/package.json','utf8'));
            delete pkg.codegenConfig;
            fs.writeFileSync('node_modules/react-native-ble-plx/package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build arm64 APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -x lint -x test

      - name: Locate APK
        id: apk
        working-directory: android
        run: |
          find app/build/outputs -name '*.apk' -type f
          APK=$(find app/build/outputs -name '*release*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs -name '*.apk' -type f | head -1)
          fi
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jindou-android-arm64.apk
          path: android/${{ steps.apk.outputs.APK }}
          if-no-files-found: error
